<!DOCTYPE html>
<html>

<head>
  <script type="text/javascript">
    // Restores the real deep-link path 404.html encoded before redirecting
    // here — must run before url_strategy/the Flutter router ever reads
    // window.location, so it's the very first thing in <head>, well ahead
    // of the deferred flutter_bootstrap.js load later in this page. See
    // 404.html's own comment and https://github.com/rafgraph/spa-github-pages.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CVForge - resume&#x2F;CV builder web app">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CVForge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  

  <title>CVForge</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <style>
    
    body {
      /* kcSurfaceSunken, so the splash ground and the app's page ground are the
         same colour and there is no flash at handover. Matches manifest.json's
         background_color. */
      background-color: #101114;
      height: 100vh;
      width: 100vw;
      position: fixed;
      inset: 0px;
      overflow: hidden;
      padding: 0px;
      margin: 0px;
      user-select: none;
      touch-action: none;
    }

    .main-content {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .4s ease-out;
    }

    /* The mark and the ring share one grid cell, so the mark is centred by the
       same flow that centres everything else. The previous `position: absolute`
       with no offsets took the logo out of .main-content's centring and pinned
       it to its static-position origin, which is why it sat left of centre on
       every cold start. */
    .splash {
      position: relative;
      display: grid;
      place-items: center;
      width: 168px;
      height: 168px;
    }

    .splash-mark {
      width: 96px;
      height: 96px;
    }

    .splash-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      /* kcBorderColor for the track, kcPrimaryColor for the travelling arc. */
      border: 3px solid #2F323A;
      border-top-color: #9600FF;
      animation: splash-spin 1s linear infinite;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-ring {
        animation: none;
      }
    }

  </style>
  <script>
    // Serve pdf.js locally, not from unpkg.com — keeps PDF preview
    // rendering fully offline/on-device, matching this app's privacy
    // stance. Relative path (leading "./" required — printing's plugin
    // feeds this straight into a dynamic import(), and browsers reject a
    // bare "pdfjs/..." specifier there) so it resolves correctly under
    // --base-href on the deployed Pages build too.
    window.dartPdfJsBaseUrl = './pdfjs/';

    {{flutter_js}}
    {{flutter_build_config}}

    function delay(time) {
      return new Promise(resolve => setTimeout(resolve, time));
    }

    window.addEventListener('load', function (ev) {
      var loaderContent = document.querySelector('#loader-content');
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          var appRunner = await engineInitializer.initializeEngine();
          loaderContent.style.opacity = "0";
          await delay(400);
          await appRunner.runApp();
        }
      });
    });
  </script>
  <div class="main-content" id="loader-content">
    <div class="splash">
      <div class="splash-ring"></div>
      <img class="splash-mark" src="main-icon.png" alt="" />
    </div>
  </div>
</body>

</html>
