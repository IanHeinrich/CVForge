name: cv_forge
description: "CV Forge - resume/CV builder web app"
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  url_strategy: ^0.3.0
  responsive_builder: ^0.7.0
  flutter_animate: ^4.1.1+1
  pdf: ^3.13.0
  file_saver: ^0.4.0
  file_selector: ^1.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.0
  printing: ^5.15.0
  dio: ^5.9.0
  remixicon: ^4.9.3
  theme_tailor_annotation: ^3.1.3
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.4
  golden_toolkit: ^0.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  theme_tailor: ^3.1.3

# See third_party/printing/README.md — a locally-patched copy of the
# published printing 5.15.0, fixing an upstream web bug that's a hard
# blocker for this app's privacy stance. Remove once fixed upstream.
dependency_overrides:
  printing:
    path: third_party/printing

flutter:
  uses-material-design: true

  # rootBundle.load() needs this to find the raw TTF bytes for
  # pw.Font.ttf() — the sole renderer now (Studio's preview rasterizes the
  # same PDF the export produces), so no `fonts:` family registration is
  # needed for a Flutter TextStyle(fontFamily: ...) that no longer exists.
  assets:
    - assets/fonts/

