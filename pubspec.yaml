name: cv_forge
description: "CV Forge - resume/CV builder web app"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  url_strategy: ^0.3.0
  responsive_builder: ^0.7.0
  flutter_animate: ^4.1.1+1
  pdf: ^3.13.0
  file_saver: ^0.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.4
  golden_toolkit: ^0.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  # Declared both ways deliberately: `assets` guarantees rootBundle.load()
  # can find the raw TTF bytes for pw.Font.ttf() (the PDF renderer), while
  # `fonts` registers the family with Flutter's text engine so the on-screen
  # preview can use TextStyle(fontFamily: 'Liberation Serif') and match.
  assets:
    - assets/fonts/

  fonts:
    - family: Liberation Serif
      fonts:
        - asset: assets/fonts/LiberationSerif-Regular.ttf
        - asset: assets/fonts/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic

