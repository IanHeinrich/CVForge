name: cv_forge
description: "CVForge - resume/CV builder web app"
publish_to: 'none'
version: 2.23.1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Supplies usePathUrlStrategy, replacing the discontinued
  # url_strategy package.
  flutter_web_plugins:
    sdk: flutter
  # `intl: any` rather than a caret range on purpose: flutter_localizations
  # pins an exact intl version per SDK, so any constraint of our own becomes a
  # version-solve failure the next time the SDK moves.
  flutter_localizations:
    sdk: flutter
  intl: any
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  responsive_builder: ^0.7.0
  flutter_animate: ^4.1.1+1
  pdf: ^3.13.0
  file_saver: ^0.4.0
  file_selector: ^1.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.0
  printing: ^5.15.0
  dio: ^5.9.0
  remixicon: ^4.9.3
  theme_tailor_annotation: ^3.1.3
  url_launcher: ^6.3.0
  web: ^1.1.1
  crypto: ^3.0.0
  flutter_svg: ^2.3.0
  # Profile-photo pipeline. `image` does the decode/orient/resize/encode —
  # `dart:ui` can only emit PNG, and a PNG photograph would be several times
  # larger inside the Vault JSON that Drive syncs on every change.
  image: ^4.9.2
  crop_image: ^1.0.17

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.4
  golden_toolkit: ^0.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  theme_tailor: ^3.1.3
  # Generates lib/app/app_version.dart from `version:` above, so a release
  # is one edit rather than two kept in step by a test. A dev dependency
  # producing a committed constant, not a runtime one — which is the same
  # reason `package_info_plus` was declined: nothing reads this back, so
  # the app should not carry a plugin to learn its own version.
  build_version: ^2.1.3

# See docs/printing-fork.md — printing 5.15.0 plus a one-line fix for an
# upstream web bug that blocks this app's privacy stance, carried on a
# fork rather than vendored. Pinned by commit so the build is
# reproducible; remove the whole block once the fix ships on pub.dev.
dependency_overrides:
  printing:
    git:
      url: https://github.com/IanHeinrich/dart_pdf.git
      ref: 15c868a2c1e53e1104b75c8557b761017f82294c
      path: printing

flutter:
  uses-material-design: true

  # Required by `flutter gen-l10n` — the tool exits outright without it. Also
  # what makes `flutter pub get` regenerate the localizations. See l10n.yaml.
  generate: true

  # rootBundle.load() needs this to find the raw TTF bytes for
  # pw.Font.ttf() — the PDF renderer reads them as bytes, not as a
  # registered family, so the `assets:` entry is what that path needs.
  assets:
    - assets/fonts/
    # The brand marks, rendered in-app by BrandMark. SVG rather than PNG so
    # the mark takes a theme colour and stays crisp at any size; see
    # assets/brand/README.md for which file is which.
    - assets/brand/

  # The same four files again, this time registered as a family. Flutter's
  # default text style asks for "Roboto", and on web CanvasKit satisfies
  # that by downloading it from fonts.gstatic.com unless the asset manifest
  # already has it — so without this, every page load fetched a font from
  # Google in an app whose whole claim is that a CV never leaves the
  # device. Same reason index.html sets dartPdfJsBaseUrl and
  # canvasKitBaseUrl to local paths.
  #
  # The bytes are already in the bundle for the PDF, so registering them
  # costs nothing beyond the manifest entry.
  #
  # This does NOT make the app request-free. CanvasKit downloads a fallback
  # font for any glyph no embedded font covers, and `RegionPreset.flags` is
  # emoji — so a screen showing a region flag still fetches Noto Color
  # Emoji. Closing that means either bundling a ~10MB emoji font or drawing
  # the flags as assets instead; neither belongs in a font registration.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

