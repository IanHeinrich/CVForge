<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 232 232" width="232" height="232"
     fill="none" stroke="currentColor" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
  <title>CVForge detail mark, anvil only</title>
  <!-- The detail mark with the hammer removed, for BrandMarkLoader to animate
       the two apart. The paths are exactly those in cvforge-mark.svg — that
       file is the source of truth for what each shape is and why it is drawn
       that way; do not edit these in isolation.

       The viewBox is wider than the mark's own 192 box because the swing
       carries the hand out past the mark's right edge. It stays square and
       centred on the mark's centre (96,96), so the art sits exactly where the
       static mark's does. cvforge-mark-hammer.svg uses the same box, so the
       two overlay without any per-layer offset. -->
  <path d="M20 36 L40 16 H92 A8 8 0 0 1 100 24 V100 H168 L174 103
           C150 116 120 130 104 154
           H134 V176 H104 A26 26 0 0 0 72 176 H44 V154 H74
           C70 146 64 138 56 132 H36 A16 16 0 0 1 20 116 Z"/>
  <path d="M40 16 V30 A6 6 0 0 1 34 36 H20"/>
  <path d="M100 100 H60 V118 C60 126 58 130 56 132"/>
  <g stroke-width="8">
    <path d="M34 54 H78"/>
    <path d="M34 70 H86"/>
    <path d="M34 86 H86"/>
  </g>
</svg>
